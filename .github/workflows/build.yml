name: Build Armadillo Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: armadillo-speed-26.3

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.9'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: armadillo-speed
          path: armadillo-speed-26.3/build/libs/*.jar
